<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fiches de révision</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Vue principale : réviseur autonome (fonctionne seul, au double-clic) -->
  <main id="home" class="view">
    <header class="topbar">
      <h1>Fiches de révision</h1>
      <button id="open-remote" class="link-btn" title="Piloter depuis une 2e fenêtre">
        🎛️ Mode télécommande
      </button>
    </header>

    <section class="card" id="home-card">
      <div class="card-meta"><span id="h-position"></span></div>
      <div class="card-face" id="h-question"></div>
      <div class="card-answer" id="h-answer" hidden></div>
    </section>

    <div class="controls">
      <button id="h-prev" class="ctrl">⟵ Préc.</button>
      <button id="h-flip" class="ctrl flip">Révéler</button>
      <button id="h-next" class="ctrl">Suiv. ⟶</button>
    </div>
    <p class="kbd-hint">Clavier : <kbd>←</kbd> <kbd>→</kbd> pour naviguer, <kbd>Espace</kbd> pour révéler</p>

    <details class="editor">
      <summary>✏️ Mes fiches</summary>
      <p class="hint">Une fiche par ligne, au format&nbsp;: <code>Question | Réponse</code></p>
      <textarea id="deck-input" rows="8" spellcheck="false"></textarea>
      <div class="editor-actions">
        <button id="save-deck">Enregistrer</button>
        <button id="reset-deck" class="ghost">Réinitialiser l'exemple</button>
        <span id="editor-status" class="status"></span>
      </div>
    </details>
  </main>

  <!-- Affichage plein écran (mode 2 fenêtres) -->
  <main id="display" class="view">
    <div class="card">
      <div class="card-meta"><span id="d-position"></span></div>
      <div class="card-face" id="d-question"></div>
      <div class="card-answer" id="d-answer" hidden></div>
      <div class="card-hint">Espace : révéler · → suivante · ← précédente</div>
    </div>
  </main>

  <!-- Télécommande (mode 2 fenêtres) -->
  <main id="remote" class="view">
    <header class="remote-head">
      <span class="badge">Télécommande</span>
      <span id="r-position"></span>
    </header>

    <div class="preview">
      <div class="preview-label">Question</div>
      <div id="r-question" class="preview-text"></div>
      <div class="preview-label" id="r-answer-label" hidden>Réponse</div>
      <div id="r-answer" class="preview-text answer" hidden></div>
    </div>

    <div class="controls">
      <button id="r-prev" class="ctrl">⟵ Préc.</button>
      <button id="r-flip" class="ctrl flip">Révéler</button>
      <button id="r-next" class="ctrl">Suiv. ⟶</button>
    </div>

    <ul id="r-list" class="jump-list"></ul>
  </main>

  <script src="app.js"></script>
</body>
</html>
